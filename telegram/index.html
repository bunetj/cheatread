<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Telegram chat simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #141414;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
        }

        .textbox-area {
            flex-shrink: 0;
        }

        .textbox-area textarea {
            width: 100%;
            height: 70px;
            padding: 10px 14px;
            background: #262626;
            border: 1px solid #333333;
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 13px;
            resize: vertical;
            font-family: inherit;
        }

        .textbox-area textarea:focus {
            outline: none;
        }

        .textbox-area textarea::placeholder {
            color: #5e6f7e;
        }

        .toolbar {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: #262626;
            border-radius: 12px;
            padding: 6px 10px;
            border: 1px solid #333333;
            align-items: center;
        }

        .menu-section {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 0 4px;
            border-right: 1px solid #333333;
        }

        .menu-section:last-child {
            border-right: none;
        }

        .menu-label {
            font-size: 10px;
            color: #5e6f7e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
            font-weight: 600;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #8e8e8e;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .menu-label-display {
            font-size: 11px;
            color: #8e8e8e;
            min-width: 28px;
            text-align: center;
        }

        .menu-range {
            width: 60px;
            accent-color: #666;
            background: #333333;
            height: 4px;
            border-radius: 2px;
        }

        .menu-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3a3a3a;
            cursor: pointer;
        }

        .menu-range::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3a3a3a;
            border: none;
            cursor: pointer;
        }

        .menu-input-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 400;
            color: #8e8e8e;
        }

        .menu-input-label input {
            width: 48px;
            padding: 2px 12px 2px 8px;
            background: #333333;
            border: none;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 12px;
            text-align: center;
        }

        .menu-input-label input:focus {
            outline: 1px solid #666;
        }

        .chat-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        .chat {
            flex: 1;
            background: #17212b;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2b3b4a;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 10px 16px;
            background: #1f2c38;
            border-bottom: 1px solid #2b3b4a;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: #2b3b4a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .chat-name {
            color: #e8edf2;
            font-weight: 600;
            font-size: 14px;
        }

        .msgs {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .msgs::-webkit-scrollbar {
            width: 4px;
        }

        .msgs::-webkit-scrollbar-track {
            background: transparent;
        }

        .msgs::-webkit-scrollbar-thumb {
            background: #2b3b4a;
            border-radius: 2px;
        }

        .msg {
            max-width: 85%;
            padding: 4px 12px 6px;
            border-radius: 16px;
            font-size: 14px;
            color: #e8edf2;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }

        .msg.own {
            background: var(--own-color, #2b5278);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            display: inline-block;
        }

        .msg.recv {
            background: var(--other-color, #2b3b4a);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            display: inline-block;
        }

        .msg {
            position: relative;
        }
        .msg a { color: #8ab4f8; text-decoration: none; }
        .msg a:hover { text-decoration: underline; }
        .msg.own a { color: #cfe3ff; }
        .msg.recv a { color: #8ab4f8; }

        .msg.reacted::after {
            content: "❤️";
            position: absolute;
            bottom: -8px;
            right: 4px;
            font-size: 11px;
            line-height: 1;
            background: var(--react-color, #8ab4f8);
            border-radius: 10px;
            padding: 2px 4px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .6);
            pointer-events: none;
        }

        .msg.recv.reacted::after {
            right: auto;
            left: 4px;
        }

        .input-area {
            background: #1f2c38;
            padding: 8px 12px;
            border-top: 1px solid #2b3b4a;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            border: none;
            border-radius: 20px;
            padding: 8px 14px;
            background: #2b3b4a;
            color: #e8edf2;
            min-height: 36px;
            max-height: 80px;
            resize: vertical;
            font-size: 14px;
            font-family: inherit;
        }

        .input-area textarea:focus {
            outline: none;
        }

        .input-area textarea::placeholder {
            color: #5e6f7e;
        }

        .input-area button {
            padding: 6px 16px;
            background: #2b5278;
            border: none;
            border-radius: 20px;
            color: #e8edf2;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
        }

        .input-area button:disabled {
            cursor: pointer;
            opacity: 1;
        }

        .chat-footer {
            padding: 4px 4px 0 4px;
            display: flex;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .chat-info {
            color: #5e6f7e;
            font-size: 12px;
            cursor: default;
        }

        

        

        

        .modal-box h3 {
            color: #e0e0e0;
            margin-bottom: 2px;
        }

        .modal-box .sub {
            color: #5e6f7e;
            font-size: 12px;
            margin-bottom: 14px;
        }

        .modal-box label {
            color: #8e8e8e;
            font-size: 12px;
            display: block;
            margin-bottom: 2px;
        }

        .modal-box input {
            width: 100%;
            padding: 8px 12px;
            background: #333333;
            border: none;
            border-radius: 8px;
            color: #e0e0e0;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .modal-box input:focus {
            outline: none;
        }

        .modal-box .btn-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-box .color-picker-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .modal-box .color-preview {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #3a3a3a;
            cursor: pointer;
            background: #3a3a3a;
            flex-shrink: 0;
            box-shadow: inset 0 0 0 2px #262626;
        }
        .modal-box .color-picker-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .modal-box input[type="color"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }
        .modal-box .color-preview:hover { border-color: #8e8e8e; }
        .modal-box #modalColor {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }
        .modal-box .btn-row button {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .modal-box .btn-cancel {
            background: #333333;
            color: #8e8e8e;
        }

        .modal-box .btn-save {
            background: #3a3a3a;
            color: #e0e0e0;
        }


        .modal-box .clip-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e0e0e0;
            font-size: 14px;
            padding: 6px 4px;
            cursor: pointer;
            user-select: none;
        }
        .modal-box .clip-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2b5278;
            cursor: pointer;
        }
        @media (max-width: 440px) {
            .app {
                padding: 4px;
                max-height: 100vh;
                height: 100vh;
            }

            .toolbar {
                padding: 4px 6px;
                gap: 2px;
            }

            .menu-section {
                padding: 0 2px;
            }

            .menu-label {
                font-size: 9px;
                display: none;
            }

            .menu-btn {
                font-size: 12px;
                padding: 2px 6px;
            }

            .menu-range {
                width: 40px;
            }
        }
    </style>
        <link rel="stylesheet" href="../shared/modal.css">
</head>

<body>

    <div class="app">
        <div class="chat-wrapper">
            <div class="chat">
                <div class="header">
                    <div class="avatar" id="avatar">👤</div>
                    <div class="chat-name" id="chatName">Alex</div>
                </div>
                <div class="msgs" id="msgs"></div>
                <div class="input-area">
                    <textarea id="ownInput" placeholder="Type message..." rows="1"></textarea>
                    <button id="sendBtn">➤</button>
                </div>
            </div>
            <div class="chat-footer">
                <span class="chat-info" title="press enter to receive">ℹ️</span>
            </div>
        </div>

        <div class="toolbar" id="toolbar"></div>
        <div class="textbox-area">
            <textarea id="inputText" placeholder="Paste script with --- between messages"></textarea>
        </div>

    </div>

    <div class="modal" id="modal">
        <div class="modal-box">
            <h3>Names</h3>
            <div class="sub">For export</div>
            <label>Your name</label>
            <input type="text" id="modalOwn" value="user">
            <label>Interlocutor</label>
            <input type="text" id="modalOther" value="Alex">
            <label>Emoji</label>
            <input type="text" id="modalEmoji" value="👤" maxlength="2">
            <label>Their color</label>
            <div class="color-picker-row">
                <div class="color-preview" id="modalColorPreview"></div>
                <input type="color" id="modalColor" value="#2b3b4a">
            </div>
            <label>My color</label>
            <div class="color-picker-row">
                <div class="color-preview" id="modalOwnPreview"></div>
                <input type="color" id="modalOwnColor" value="#2b5278">
            </div>
            <div class="btn-row">
                <button class="btn-cancel" id="modalCancel">Cancel</button>
                <button class="btn-save" id="modalSave">Save</button>
            </div>
        </div>
    </div>

    <div class="modal" id="clipModal">
        <div class="modal-box">
            <h3>Copy chat</h3>
            <label class="clip-check"><input type="checkbox" id="clipAll" checked> All messages</label>
            <label class="clip-check"><input type="checkbox" id="clipOwn"> Only user</label>
            <label class="clip-check"><input type="checkbox" id="clipRecv"> Only interlocutor</label>
            <label class="clip-check"><input type="checkbox" id="clipReacted"> Reacted ❤️</label>
            <div class="btn-row" style="margin-top:14px;">
                <button class="btn-cancel" id="clipCancel">Cancel</button>
                <button class="btn-save" id="clipCopy">Copy</button>
            </div>
        </div>
    </div>

                <script src="../shared/ui.js"></script>
    <script src="../shared/text.js"></script>
        <script src="../shared/prep.js"></script>
<script>
        // ============================================================
        // CHAT MFV - Working Version
        // ============================================================

        // STATE
        const state = {
            ownName: 'user',
            otherName: 'Alex',
            avatarEmoji: '👤',
            avatarColor: '#2b3b4a',
            ownColor: '#2b5278',
            lastLoadedScript: '',
            queue: [],
            finished: false,
            wpm: 200,
            fontSize: 14,
            currentIndex: 0,
            displayedCount: 0,
            userScrolledUp: false,
            isProgrammaticScroll: false,
        };

        // DOM REFS
        const input = document.getElementById('inputText');
        const msgs = document.getElementById('msgs');
        const ownInput = document.getElementById('ownInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatName = document.getElementById('chatName');
        const modal = document.getElementById('modal');
        const modalOwn = document.getElementById('modalOwn');
        const modalOther = document.getElementById('modalOther');
        const modalCancel = document.getElementById('modalCancel');
        const modalSave = document.getElementById('modalSave');
        const modalEmoji = document.getElementById('modalEmoji');
        const modalColor = document.getElementById('modalColor');
        const modalColorPreview = document.getElementById('modalColorPreview');
        const modalOwnColor = document.getElementById('modalOwnColor');
        const modalOwnPreview = document.getElementById('modalOwnPreview');
        const avatar = document.getElementById('avatar');

        // ===== tiny offline markdown -> html =====
        function __mdEsc(s) {
            return String(s).replace(/[&<>"']/g, m => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[m]));
        }
        function __md(md) {
            md = String(md == null ? '' : md);
            var placeholders = [];
            function stash(html) {
                placeholders.push(html);
                return '\u0000' + (placeholders.length - 1) + '\u0000';
            }
            md = md.replace(/```([\s\S]*?)```/g, function (_, code) {
                return stash('<pre><code>' + __mdEsc(code.replace(/^\n/, '')) + '</code></pre>');
            });
            md = md.replace(/`([^`\n]+)`/g, function (_, c) {
                return stash('<code>' + __mdEsc(c) + '</code>');
            });
            md = __mdEsc(md);
            md = md.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) {
                return '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>';
            });
            md = md.replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g, function (_, pre, url) {
                return pre + '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
            });
            md = md.replace(/^### (.*)$/gm, '<h3>$1</h3>');
            md = md.replace(/^## (.*)$/gm,  '<h2>$1</h2>');
            md = md.replace(/^# (.*)$/gm,   '<h1>$1</h1>');
            md = md.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
            md = md.replace(/(^|\W)\*([^*\n]+)\*(\W|$)/g, '$1<i>$2</i>$3');
            md = md.replace(/^\s*[-*] (.*)$/gm, '<li>$1</li>');
            md = md.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
            md = md.replace(/<\/ul>\s*<ul>/g, '');
            md = md.replace(/\n{2,}/g, '</p><p>');
            md = md.replace(/\n/g, '<br>');
            md = '<p>' + md + '</p>';
            md = md.replace(/\u0000(\d+)\u0000/g, function (_, i) { return placeholders[+i]; });
            return md;
        }

        // Detect manual scroll (ignore programmatic)
        msgs.addEventListener('scroll', function () {
            // Ignore programmatic scrolls
            if (state.isProgrammaticScroll) {
                state.isProgrammaticScroll = false;
                return;
            }
            var isAtBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 10;
            if (isAtBottom) {
                state.userScrolledUp = false;
            } else {
                state.userScrolledUp = true;
            }
        });

        // Double-click toggles the heart reaction on a message
        msgs.addEventListener('dblclick', function (e) {
            var msg = e.target.closest('.msg');
            if (!msg) return;
            msg.classList.toggle('reacted');
            saveState();
        });

        // HELPERS
        function splitBySeparator(text) {
            var blocks = text.split(/\n\s*---\s*\n/).filter(function (s) { return s.trim(); });
            var out = [];
            for (var i = 0; i < blocks.length; i++) {
                var parts = splitOnDashes(blocks[i]);
                for (var j = 0; j < parts.length; j++) {
                    if (parts[j]) out.push(parts[j]);
                }
            }
            return out;
        }

        function getDelay(item) {
            var chars = item ? item.length : 0;
            var delay = 600 + Math.random() * 300;
            var typingTime = (chars / state.wpm) * 60000;
            if (chars > 30) typingTime *= 0.85;
            if (chars > 80) typingTime *= 0.70;
            if (chars > 150) typingTime *= 0.60;
            delay += typingTime;
            if (item && /[.!?]$/.test(item)) delay += 250 + Math.random() * 150;
            if (item && /[,;:]$/.test(item)) delay += 100 + Math.random() * 100;
            delay *= (0.85 + Math.random() * 0.3);
            return Math.max(400, Math.min(10000, delay));
        }

        // FONT
        function applyFontSize() {
            var els = document.querySelectorAll('.msg');
            for (var i = 0; i < els.length; i++) {
                els[i].style.fontSize = state.fontSize + 'px';
            }
            var label = document.getElementById('sizeLabel');
            if (label) label.textContent = state.fontSize + 'px';
        }

        function fontIncrease() {
            state.fontSize = Math.min(state.fontSize + 2, 40);
            applyFontSize();
        }
        function fontDecrease() {
            state.fontSize = Math.max(state.fontSize - 2, 10);
            applyFontSize();
        }

        // CHAT FUNCTIONS
        function updateChatName() {
            chatName.textContent = state.otherName;
            if (avatar) {
                avatar.textContent = state.avatarEmoji || '👤';
                avatar.style.background = state.avatarColor || '#2b5278';
            }
            if (msgs) {
                msgs.style.setProperty('--own-color', state.ownColor);
                msgs.style.setProperty('--other-color', state.avatarColor);
                msgs.style.setProperty('--react-color', state.ownColor);
            }
        }

        function addMsg(text, type) {
            var d = document.createElement('div');
            d.className = 'msg ' + type;
            if (type === 'own') {
                d.textContent = text;
            } else {
                d.innerHTML = __md(text);
            }
            msgs.appendChild(d);
            state.displayedCount++;
            applyFontSize();
            // Only scroll if user hasn't scrolled up
            if (!state.userScrolledUp) {
                state.isProgrammaticScroll = true;
                msgs.scrollTop = msgs.scrollHeight;
            }
            saveState();
        }

        function updateUI() {
            var hasQueue = state.queue.length > 0;
            var hasOwn = ownInput.value.trim() !== '';
            var hasScript = input.value.trim() !== '';
            sendBtn.disabled = !(hasQueue || hasOwn || hasScript);
        }

        function loadChat() {
            var raw = input.value;
            state.queue = splitBySeparator(raw, '\n---\n');
            state.finished = false;
            state.currentIndex = 0;
            state.displayedCount = 0;
            state.lastLoadedScript = raw;
            // NEVER clear messages - preserve chat history
            updateUI();
        }

        function sendScenario() {
            if (state.finished || !state.queue.length) return;
            var next = state.queue.shift();
            // When a new message arrives from the queue, reset scroll state
            // so user sees the conversation continuing
            state.userScrolledUp = false;
            addMsg(next, 'recv');
            state.currentIndex = state.displayedCount;
            if (!state.queue.length) {
                state.finished = true;
                // NOTE: textarea is intentionally NOT cleared — keep the script
            }
            updateUI();
        }

        function sendOwn() {
            var t = ownInput.value.trim();
            if (!t) return;
            // Reset scroll state - user is engaging, go to bottom
            state.userScrolledUp = false;
            addMsg(t, 'own');
            ownInput.value = '';
            updateUI();
        }

        function handleSend() {
            // If the user wrote a new script since the last load, treat
            // it as fresh: reset finished/queue/state and reload.
            if (input.value !== state.lastLoadedScript) {
                state.finished = false;
                state.currentIndex = 0;
                state.queue = splitBySeparator(input.value, '\n---\n');
                state.lastLoadedScript = input.value;
            }

            var hasOwn = ownInput.value.trim() !== '';
            var hasQueue = state.queue.length > 0;
            var hasScript = input.value.trim() !== '';

            if (!hasOwn && !hasQueue && state.finished) {
                return;
            }

            // Sending your own message: never touch autoplay.
            if (hasOwn) {
                state.userScrolledUp = false;
                sendOwn();
                return;
            }

            // Empty own-input + autoplay running:
            // deliver ONE queued message, then stop autoplay ("manual mode").
            if (autoPlay && autoPlay.isPlaying()) {
                autoPlay.stopPlay();
                if (hasQueue) { sendScenario(); return; }
                return;
            }

            // No own message, autoplay not running: advance the queue manually.
            if (hasQueue) { sendScenario(); return; }
            if (hasScript) {
                state.finished = false;
                loadChat();
                if (state.queue.length) sendScenario();
                return;
            }
        }

                function writeClipboard(text, onResult) {
            onResult = onResult || function () {};
            if (text == null) text = '';

            function tryLegacy() {
                var ok = fallbackCopy(text);
                onResult(ok ? 'ok' : 'fail');
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(
                    function () { onResult('ok'); },
                    function (err) {
                        console.warn('clipboard.writeText failed:', err);
                        tryLegacy();
                    }
                );
            } else {
                tryLegacy();
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            // Must be visible-ish and focused for execCommand to work.
            ta.style.position = 'fixed';

                function writeClipboard(text, onResult) {
            onResult = onResult || function () {};
            if (text == null) text = '';

            function tryLegacy() {
                var ok = fallbackCopy(text);
                onResult(ok ? 'ok' : 'fail');
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(
                    function () { onResult('ok'); },
                    function (err) {
                        console.warn('clipboard.writeText failed:', err);
                        tryLegacy();
                    }
                );
            } else {
                tryLegacy();
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            // Must be visible-ish and focused for execCommand to work.
            ta.style.position = 'fixed';

                        function exportChat(opts) {
            opts = opts || {};
            var wantAll     = !!opts.all;
            var wantOwn     = !!opts.own;
            var wantRecv    = !!opts.recv;
            var wantReacted = !!opts.reacted;

            if (wantAll) { wantOwn = true; wantRecv = true; }

            var speakerFilterActive = wantOwn || wantRecv;
            if (!speakerFilterActive && !wantReacted) {
                showClipToast('Nothing selected');
                return;
            }

            var speakerCount  = (wantOwn ? 1 : 0) + (wantRecv ? 1 : 0);
            var singleSpeaker = (speakerCount === 1 && !wantReacted);

            var items = msgs.querySelectorAll('.msg');
            var parts = [];

            for (var i = 0; i < items.length; i++) {
                var m = items[i];
                var isOwn     = m.classList.contains('own');
                var isReacted = m.classList.contains('reacted');

                var inSpeakerSet = speakerFilterActive &&
                    ((isOwn && wantOwn) || (!isOwn && wantRecv));
                var inReactedSet = wantReacted && isReacted;

                if (!inSpeakerSet && !inReactedSet) continue;

                var text = m.textContent.trim();
                if (!text) continue;

                if (singleSpeaker) {
                    parts.push(text);
                } else {
                    parts.push('[' + (isOwn ? state.ownName : state.otherName) + ']\n' + text);
                }
            }

            if (!parts.length) {
                showClipToast('Nothing matched');
                return;
            }

            var payload;
            if (singleSpeaker) {
                var who = wantOwn ? state.ownName : state.otherName;
                payload = '[' + who + ']\n' + parts.join('\n\n');
            } else {
                payload = parts.join('\n\n');
            }

            writeClipboard(payload, function (status) {
                if (status === 'ok') {
                    showClipToast('Copied ' + parts.length);
                } else {
                    showClipToast('Copy blocked');
                }
            });

// split on sentence punctuation, allow trailing quotes/brackets
// after the punct; strip punctuation and quotes from both ends of each piece.
function __punctSplit(text) {
    // 1) split when .,!?;: is followed (optionally) by closing quotes/brackets
    //    and then whitespace or EOL.
    var parts = [];
    var buf = '';
    var closes = ')"\'\u201D\u2019\u00BB\]';
    for (var i = 0; i < text.length; i++) {
        var c = text[i];
        buf += c;
        if ('.!?;:,'.indexOf(c) === -1) continue;
        // consume any trailing closing marks
        var j = i + 1;
        while (j < text.length && closes.indexOf(text[j]) !== -1) {
            buf += text[j];
            j++;
        }
        var next = text[j];
        if (next === undefined || /\s/.test(next)) {
            parts.push(buf);
            buf = '';
            i = j - 1;
        }
    }
    if (buf) parts.push(buf);

    // 2) strip leading/trailing punctuation and closing marks from each piece
    var lead  = /^[.,!?;:)\]"'\u201C\u201D\u2018\u2019\u00AB\u00BB]+/g;
    var trail = /[.,!?;:)\]"'\u201C\u201D\u2018\u2019\u00AB\u00BB]+$/g;
    var out = [];
    for (var k = 0; k < parts.length; k++) {
        var p = parts[k].replace(lead, '').replace(trail, '').trim();
        if (p) out.push(p);
    }
    return out;
}

// telegram: split by `---` OR blank lines
function tgSplit(raw) {
    var blocks = raw.split(/\n\s*---\s*\n|\n\s*\n/)
              .map(function (s) { return s.trim(); })
              .filter(function (s) { return s; });
    var out = [];
    for (var i = 0; i < blocks.length; i++) {
        var parts = splitOnDashes(blocks[i]);
        for (var j = 0; j < parts.length; j++) {
            if (parts[j]) out.push(parts[j]);
        }
    }
    return out;
}
function tgJoin(blocks) {
    return blocks.join('\n---\n');
}
